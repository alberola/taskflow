services:
  # --- Backend (PHP + Laravel) ---
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: taskflow_app
    volumes:
      - ./backend:/var/www/html
    networks:
      - taskflow_net
    depends_on:
      - mysql

  # --- Frontend (Node + Vue) ---
  node:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    container_name: taskflow_node
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    networks:
      - taskflow_net
    command: sh -c "npm install && npm run dev"

  # --- Servidor Nginx ---
  nginx:
    image: nginx:stable-alpine
    container_name: taskflow_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - taskflow_net
    depends_on:
      - app

  # --- Base de datos MySQL ---
  mysql:
    image: mysql:8.0
    container_name: taskflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow_user
      MYSQL_PASSWORD: taskflow_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taskflow_net

  # --- phpMyAdmin (opcional) ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: taskflow_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    networks:
      - taskflow_net

networks:
  taskflow_net:

volumes:
  mysql_data:
